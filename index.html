    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Obfuscated & Minified */
        :root{--bg-dark:#0a0e17;--bg-card:#121824;--gold-accent:#e5b839;--border-gold:#8a6d1b;--text-main:#f8fafc;--text-muted:#94a3b8}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Cairo',sans-serif;background-color:var(--bg-dark);color:var(--text-main);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
        .profile-container{width:100%;max-width:420px;background-color:var(--bg-card);border:1px solid var(--border-gold);border-radius:16px;padding:2.5rem 1.5rem;box-shadow:0 8px 24px rgba(0,0,0,0.5);text-align:center}
        .logo-title{font-size:2.2rem;font-weight:900;font-family:Arial,sans-serif;margin-bottom:.2rem;display:flex;justify-content:center;align-items:center;direction:ltr}
        .logo-title span{display:inline-block;color:var(--gold-accent);animation:seqFade 2.4s infinite cubic-bezier(.4,0,.2,1);animation-delay:calc(.18s * var(--i))}
        .logo-title .space{width:.45em}
        @keyframes seqFade{0%,100%{opacity:1;filter:blur(0);text-shadow:0 0 14px rgba(229,184,57,.5);transform:scale(1)}50%{opacity:0;filter:blur(4px);text-shadow:none;transform:scale(.92)}}
        .sub-title{font-size:.9rem;color:var(--text-muted);margin-bottom:1.5rem}
        .gold-divider{height:2px;background:linear-gradient(90deg,transparent,var(--border-gold),var(--gold-accent),var(--border-gold),transparent);margin:1rem 0 1.5rem 0}
        .links-list{display:flex;flex-direction:column;gap:1rem}
        .social-link{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.2rem;background:rgba(255,255,255,0.02);border:1px solid var(--border-gold);border-radius:12px;color:var(--text-main);text-decoration:none;font-weight:700;font-size:1rem;transition:all .3s ease}
        .social-link:hover{transform:translateY(-3px);border-color:var(--gold-accent);background:rgba(229,184,57,0.1);color:var(--gold-accent);box-shadow:0 4px 15px rgba(229,184,57,0.15)}
        .link-content{display:flex;align-items:center;gap:12px}
        .social-icon{font-size:1.4rem;width:24px;text-align:center}
        .fa-youtube{color:#ff0000}.fa-telegram{color:#229ed9}.fa-facebook{color:#1877f2}.fa-instagram{color:#e4405f}.fa-tiktok{color:#fff}
        .arrow-icon{font-size:.85rem;color:var(--text-muted);transition:transform .3s ease,color .3s ease}
        .social-link:hover .arrow-icon{transform:translateX(-4px);color:var(--gold-accent)}
    </style>
</head>
